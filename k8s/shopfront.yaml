apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopfront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopfront
  template:
    metadata:
      labels:
        app: shopfront
    spec:
      containers:
      - name: shopfront
        image: bhushanpatil/shopfront:v1
        ports:
        - containerPort: 8010
---
apiVersion: v1
kind: Service
metadata:
  name: shopfront
spec:
  type: NodePort
  selector:
    app: shopfront
  ports:
  - port: 8010
    targetPort: 8010
    nodePort: 30010
